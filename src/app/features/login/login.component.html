<div class="login-page">
  <div class="login-ambient"></div>

  <a routerLink="/" class="back-link" aria-label="Voltar para a página inicial">
    <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5M5 12l7 7M5 12l7-7"/>
    </svg>
    <span>Início</span>
  </a>

  <div class="login-card">
    <div class="login-brand">
      <div class="brand-icon-wrap">
        <img src="assets/logo.png" alt="MindCare AI" />
      </div>
      <span class="brand-name">MindCare AI</span>
    </div>

    <div class="login-hero">
      <h1>Bem-vindo de volta</h1>
      <p>Entre para enviar análises do MindCheck AI e revisar o histórico de triagens.</p>
    </div>

    <form class="login-form" [formGroup]="signInForm" (ngSubmit)="submitSignIn()">
      <div class="field-group">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="seu@email.com"
        />
        <small class="field-error" [class.visible]="signInForm.get('email')?.touched && signInForm.get('email')?.invalid">
          Informe um email válido.
        </small>
      </div>

      <div class="field-group">
        <label for="senha">Senha</label>
        <input
          id="senha"
          type="password"
          formControlName="senha"
          placeholder="Digite sua senha"
          appCapsLock
          (capsLock)="capsLockOn = $event"
        />
        <small class="field-error" [class.visible]="signInForm.get('senha')?.touched && signInForm.get('senha')?.invalid">
          A senha é obrigatória.
        </small>
        <small class="caps-warning" [class.visible]="capsLockOn">
          Caps Lock ativado
        </small>
      </div>

      <div class="login-error" *ngIf="errorMessage">{{ errorMessage }}</div>

      <button type="submit" class="btn-primary" [disabled]="loadingSignIn">
        {{ loadingSignIn ? 'Entrando...' : 'Entrar na conta' }}
      </button>
    </form>

    <div class="login-divider">
      <span>ou</span>
    </div>

    <div class="switch-link">
      Precisa de uma conta? <a routerLink="/register">Cadastre-se gratuitamente</a>
    </div>
  </div>
</div>
