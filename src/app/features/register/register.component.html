<div class="login-page">
  <div class="login-ambient"></div>

  <div class="login-card">
    <div class="login-brand">
      <div class="brand-icon-wrap">
        <img src="assets/logo.png" alt="MindCare AI" />
      </div>
      <span class="brand-name">MindCare AI</span>
    </div>

    <div class="login-hero">
      <h1>Crie sua conta</h1>
      <p>Cadastre-se para começar a enviar análises ao MindCheck AI.</p>
    </div>

    <form class="login-form" [formGroup]="registerForm" (ngSubmit)="submitRegister()">
      <div class="field-group">
        <label for="nome">Nome completo</label>
        <input id="nome" type="text" formControlName="nome" placeholder="Seu nome completo" />
        <small class="field-error" [class.visible]="registerForm.get('nome')?.touched && registerForm.get('nome')?.invalid">
          Informe um nome válido.
        </small>
      </div>

      <div class="field-group">
        <label for="empresa">Empresa</label>
        <input id="empresa" type="text" formControlName="empresa" placeholder="Nome da empresa" />
        <small class="field-error" [class.visible]="registerForm.get('empresa')?.touched && registerForm.get('empresa')?.invalid">
          O nome da empresa é obrigatório.
        </small>
      </div>

      <div class="field-group">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" placeholder="seu@email.com" />
        <small class="field-error" [class.visible]="registerForm.get('email')?.touched && registerForm.get('email')?.invalid">
          Informe um email válido.
        </small>
      </div>

      <div class="field-group">
        <label for="senha">Senha</label>
        <input
          id="senha"
          type="password"
          formControlName="senha"
          placeholder="No mínimo 6 caracteres"
          appCapsLock
          (capsLock)="capsLockOn = $event"
        />
        <small class="field-error" [class.visible]="registerForm.get('senha')?.touched && registerForm.get('senha')?.invalid">
          A senha deve ter pelo menos 6 caracteres.
        </small>
        <small class="caps-warning" [class.visible]="capsLockOn">
          Caps Lock ativado
        </small>
      </div>

      <div class="login-error" *ngIf="errorMessage">{{ errorMessage }}</div>

      <button type="submit" class="btn-primary" [disabled]="loading">
        {{ loading ? 'Cadastrando...' : 'Criar conta' }}
      </button>
    </form>

    <div class="login-divider">
      <span>ou</span>
    </div>

    <div class="switch-link">
      Já tem uma conta? <a routerLink="/login">Entrar</a>
    </div>
  </div>
</div>
