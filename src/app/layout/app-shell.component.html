<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">MC</div>
      <div>
        <div class="brand-title">MindCare AI</div>
        <div class="brand-subtitle">Interface MindCheck</div>
      </div>
    </div>

    <nav class="nav">
      <a routerLink="/analysis/new" routerLinkActive="active">Nova análise</a>
      <a routerLink="/history" routerLinkActive="active">Histórico</a>
      <a routerLink="/about" routerLinkActive="active">Sobre</a>
    </nav>

    <div class="sidebar-footer">
      <div class="status-pill" [class.missing]="!(token$ | async)">
        {{ (token$ | async) ? 'Sessão ativa' : 'Sessão pendente' }}
      </div>
      <button class="ghost" type="button" (click)="logout()">Sair</button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="page-title">
        <h1>MindCheck AI</h1>
        <p>Fluxo de triagem e encaminhamentos corporativos</p>
      </div>
      <div class="topbar-actions">
        <div class="auth-state">
          <span class="label">Status de acesso</span>
          <strong>{{ (token$ | async) ? 'Acesso ativo' : 'Acesso pendente' }}</strong>
        </div>
      </div>
    </header>

    <main class="content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
