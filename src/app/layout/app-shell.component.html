<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark-wrap">
        <img src="assets/logo.png" alt="MindCare AI" />
      </div>
      <div>
        <div class="brand-title">MindCare AI</div>
        <div class="brand-subtitle">Triagem Inteligente</div>
      </div>
    </div>

    <nav class="nav">
      <a routerLink="/analysis/new" routerLinkActive="active">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="12" y1="18" x2="12" y2="12"/>
          <line x1="9" y1="15" x2="15" y2="15"/>
        </svg>
        Nova análise
      </a>
      <a routerLink="/history" routerLinkActive="active">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <polyline points="12 6 12 12 16 14"/>
        </svg>
        Histórico
      </a>
      <a routerLink="/about" routerLinkActive="active">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="16" x2="12" y2="12"/>
          <line x1="12" y1="8" x2="12.01" y2="8"/>
        </svg>
        Sobre
      </a>
    </nav>

    <a class="sidebar-footer user-link" routerLink="/profile" routerLinkActive="active">
      <ng-container *ngIf="user$ | async as user; else loadingUser">
        <div class="user-avatar">{{ initials }}</div>
        <div class="user-meta">
          <span class="user-name">{{ user.nome ?? 'Sem nome' }}</span>
          <span class="user-role">{{ user.empresa?.nome ?? 'Sem empresa' }}</span>
        </div>
      </ng-container>
      <ng-template #loadingUser>
        <div class="user-avatar">...</div>
        <div class="user-meta">
          <span class="user-name">Carregando...</span>
        </div>
      </ng-template>
    </a>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="page-title">
        <h1>MindCheck AI</h1>
        <p>Fluxo de triagem e encaminhamentos corporativos</p>
      </div>
      <div class="topbar-actions">
        <div class="auth-state">
          <span class="status-dot"></span>
          <strong>{{ (token$ | async) ? 'Acesso ativo' : 'Acesso pendente' }}</strong>
        </div>
      </div>
    </header>

    <main class="content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
